name: Node.js CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install backend dependencies
        run: |
          npm ci --prefix wf-control --ignore-scripts
          npm ci --prefix wf-app --ignore-scripts
          npm ci --prefix e2e --ignore-scripts
      - name: Test backends and end-to-end flows
        run: |
          npm test --prefix wf-control
          npm test --prefix wf-app
          npm test --prefix e2e
      - name: Install and test admin
        run: |
          npm ci --prefix wf-admin --ignore-scripts --legacy-peer-deps
          CI=true npm test --prefix wf-admin -- --watchAll=false --runInBand
      - name: Build admin
        # Bootstrap 4 emits an upstream color-adjust deprecation warning.
        run: CI=false npm run build --prefix wf-admin
